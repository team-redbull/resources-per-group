# The Custom Resource State config: what to read, and which fields to lift.
# Generated from values.yaml. Never edit this file directly.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ownership-metrics.fullname" . }}-crs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ownership-metrics.labels" . | nindent 4 }}
data:
  crs.yaml: |
    kind: CustomResourceStateMetrics
    spec:
      resources:
        - groupVersionKind:
            group: {{ .Values.clusterOwner.group }}
            version: {{ .Values.clusterOwner.version }}
            kind: {{ .Values.clusterOwner.kind }}
          metricNamePrefix: {{ .Values.metric.prefix }}
          # The object's NAME is the cluster's name.
          labelsFromPath:
            cr_name: [metadata, name]
          metrics:
            - name: "{{ .Values.metric.name }}"
              help: "Ownership of a cluster. Value is always 1."
              each:
                type: Info
                info:
                  labelsFromPath:
                    type: [spec, type]
                    {{- range .Values.ownershipFields }}
                    {{ . }}: [spec, {{ . }}]
                    {{- end }}
