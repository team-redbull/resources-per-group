# Identity and permissions. Read-only: no write verbs anywhere.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ownership-metrics.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ownership-metrics.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ownership-metrics.fullname" . }}
  labels:
    {{- include "ownership-metrics.labels" . | nindent 4 }}
rules:
  # kube-state-metrics DISCOVERS what to watch through the CRD list.
  # Without this it never starts watching, and exports nothing - silently.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["{{ .Values.clusterOwner.group }}"]
    resources: ["{{ .Values.clusterOwner.plural }}"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ownership-metrics.fullname" . }}
  labels:
    {{- include "ownership-metrics.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ownership-metrics.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ownership-metrics.fullname" . }}
    namespace: {{ .Release.Namespace }}
