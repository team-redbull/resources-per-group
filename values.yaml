# =============================================================
# ownership-metrics
# Runs ONE kube-state-metrics on the MCE hub. It reads the owner
# ConfigMaps this chart creates, and exports one row per cluster:
#
#   kube_cluster_ownership_info{cr_name, type, merkaz, anaf, mador} 1
#
# Hosted and UPI clusters are handled identically - only "type"
# differs. Nothing is written on HostedCluster objects, and no
# cluster-monitoring-config is ever touched.
# =============================================================

# ---------------- THE REGISTRY -------------------------------
# One entry per cluster. This list is the single source of truth.
# The chart turns each entry into a small ConfigMap, and
# kube-state-metrics turns each ConfigMap into one metric row.
#
# Rules, all enforced before anything is deployed:
#   - "cluster" must match that cluster's remote-write "cluster"
#     label, and be unique across ALL clusters.
#   - "type" is ClickCluster (hosted) or UPI.
#   - Every ownership level must be set. Use "generic" where one
#     does not apply.
#   - Values must be lowercase letters, digits and hyphens.
clusters: []
#  - cluster: cluster-b
#    type: ClickCluster
#    merkaz: haifa
#    anaf: infra
#    mador: platform
#
#  - cluster: upi-prod-1
#    type: UPI
#    merkaz: haifa
#    anaf: generic
#    mador: security

# Your ownership levels, in order. Add a line here and it flows into
# the ConfigMaps, the validation and the metric.
ownershipFields:
  - merkaz
  - anaf
  - mador

# The label keys written on the generated ConfigMaps, and read back
# by kube-state-metrics. Both sides come from here, so they cannot
# drift apart.
labelPrefix: cluster-owner
labelSeparator: "/"

# Allowed shape for every value. This is what stops "generic" and
# "Generic" quietly becoming two different groups.
valuePattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"

# Allowed cluster types.
types:
  - ClickCluster
  - UPI

# The exported metric. Final name is <prefix>_<name> EXACTLY.
# Nothing is appended for you. An Info metric must be NAMED with
# _info, or kube-state-metrics registers it and produces NO rows.
metric:
  prefix: kube_cluster
  name: ownership_info

image:
  repository: registry.k8s.io/kube-state-metrics/kube-state-metrics
  tag: v2.16.0
  pullPolicy: IfNotPresent

replicaCount: 1

# 128Mi is NOT enough: OOMKilled, exit 137, with clean startup logs.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

# Debugging only. "--v=5" shows why an object produces no row.
extraArgs: []

serviceMonitor:
  enabled: true
  interval: 60s
  scrapeProtocols: []

nodeSelector: {}
tolerations: []
affinity: {}
