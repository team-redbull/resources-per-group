# =============================================================
# ownership-metrics
# The only file you normally edit.
# =============================================================

# The label prefix on your HostedCluster objects.
labelPrefix: res-owner.io

# The ownership levels, in order.
# Add or remove a line here and everything follows:
# the RBAC, the CRS config and the exported metric.
ownershipFields:
  - merkaz
  - anaf
  - mador

# The custom resource to read.
customResource:
  group: hypershift.openshift.io
  version: v1beta1
  kind: HostedCluster

# The exported metric.
# Final name is <prefix>_<name>_info  because type Info adds "_info".
# So by default:  kube_hostedcluster_ownership_info
metric:
  prefix: kube_hostedcluster
  name: ownership

image:
  repository: registry.k8s.io/kube-state-metrics/kube-state-metrics
  tag: v2.13.0
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi

serviceMonitor:
  enabled: true
  interval: 60s

nodeSelector: {}
tolerations: []
affinity: {}
