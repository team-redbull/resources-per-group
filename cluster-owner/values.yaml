# =============================================================
# CHART B - cluster-owner  (this cluster's owner record)
#
# Creates ONE ConfigMap describing who owns THIS cluster.
# Chart A (ownership-metrics) reads its labels and turns them
# into kube_configmap_labels.
#
# One release per cluster:
#   ClickCluster -> on the MCE hub, with the cluster's creation
#   UPI          -> on that UPI cluster, its own Application
# Same chart either way. Only these values differ.
# =============================================================

# REQUIRED. This cluster's name.
# MUST equal the cluster's remote-write "cluster" external label,
# and be unique across ALL clusters, both types.
# That string is the join key to the node metrics.
cluster: ""

# How the cluster was built. ClickCluster or UPI.
type: UPI

# REQUIRED. Every level must be set.
# Use "generic" for a level that does not apply.
owners:
  merkaz: ""
  anaf: ""
  mador: ""

# ---- The contract with chart A ------------------------------
# These MUST match chart A's values, and both charts MUST deploy
# to the same namespace. Otherwise the exporter lifts nothing and
# this cluster vanishes from the dashboard with no error anywhere.
labelPrefix: cluster-owner
labelSeparator: "/"

# The marker that says "this ConfigMap IS an owner record".
# Chart A reads every ConfigMap in its namespace - it has no label
# selector - so without this, any other ConfigMap carrying a
# cluster-owner/* label would become a metric row.
markerKey: record
markerValue: "true"

ownershipFields:
  - merkaz
  - anaf
  - mador

# Allowed shape for the cluster name and every owner value.
# This is what stops "generic" and "Generic" quietly becoming
# two different groups.
valuePattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"

# Allowed cluster types.
types:
  - ClickCluster
  - UPI

# Defaults to owner-<cluster>.
configMapName: ""
