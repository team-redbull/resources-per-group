# A hosted (ClickCluster) cluster.
# The object NAME must equal the cluster's remote-write "cluster" label,
# which for a hosted cluster is its HostedCluster name.
apiVersion: cluster-owner.io/v1alpha1
kind: ClusterOwner
metadata:
  name: cluster-b
spec:
  type: ClickCluster
  merkaz: haifa
  anaf: infra
  mador: platform
