# Identity and permissions. Read-only: no write verbs anywhere.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ownership-metrics.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ownership-metrics.labels" . | nindent 4 }}
---
# kube-state-metrics DISCOVERS what to watch through the CRD list.
# Without this it never starts watching, and exports nothing - silently.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ownership-metrics.fullname" . }}
  labels:
    {{- include "ownership-metrics.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ownership-metrics.fullname" . }}
  labels:
    {{- include "ownership-metrics.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ownership-metrics.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ownership-metrics.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# Reading ConfigMaps is scoped to THIS namespace only - a Role, not a
# ClusterRole. The exporter can never see ConfigMaps anywhere else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ownership-metrics.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ownership-metrics.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ownership-metrics.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ownership-metrics.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ownership-metrics.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ownership-metrics.fullname" . }}
    namespace: {{ .Release.Namespace }}
