# Identity and permissions.
# Read-only: no write verbs anywhere.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ownership-metrics.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ownership-metrics.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ownership-metrics.fullname" . }}
  labels:
    {{- include "ownership-metrics.labels" . | nindent 4 }}
rules:
  - apiGroups: ["{{ .Values.customResource.group }}"]
    resources: ["hostedclusters", "nodepools"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ownership-metrics.fullname" . }}
  labels:
    {{- include "ownership-metrics.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ownership-metrics.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ownership-metrics.fullname" . }}
    namespace: {{ .Release.Namespace }}
