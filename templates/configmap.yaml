# The Custom Resource State config: what to read, and which labels to lift.
# Generated from values.yaml. Never edit this file directly.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ownership-metrics.fullname" . }}-crs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ownership-metrics.labels" . | nindent 4 }}
data:
  crs.yaml: |
    kind: CustomResourceStateMetrics
    spec:
      resources:
        - groupVersionKind:
            group: ""
            version: v1
            kind: ConfigMap
          metricNamePrefix: {{ .Values.metric.prefix }}
          labelsFromPath:
            cr_name: [metadata, labels, "{{ .Values.labelPrefix }}{{ .Values.labelSeparator }}cluster"]
          metrics:
            - name: "{{ .Values.metric.name }}"
              help: "Ownership of a cluster. Value is always 1."
              each:
                type: Info
                info:
                  labelsFromPath:
                    type: [metadata, labels, "{{ .Values.labelPrefix }}{{ .Values.labelSeparator }}type"]
                    {{- range .Values.ownershipFields }}
                    {{ . }}: [metadata, labels, "{{ $.Values.labelPrefix }}{{ $.Values.labelSeparator }}{{ . }}"]
                    {{- end }}
